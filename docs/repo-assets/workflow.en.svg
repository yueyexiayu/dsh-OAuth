<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">Let official flows own authorization</title><desc id="desc">Tokens stay outside the renderer/conversation. Switching waits for the previous flow to settle.</desc><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#567f7e"/></marker></defs><rect x="1" y="1" width="1118" height="358" rx="24" fill="#f3faf8" stroke="#d3e7e0"/><text x="40" y="49" fill="#163d45" font-size="25" font-weight="700">Let official flows own authorization</text><text x="40" y="81" fill="#56747a" font-size="15">CONCEPT DIAGRAM · NOT AN APPLICATION SCREENSHOT</text><path d="M282 195h18" stroke="#567f7e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="56" y="155" width="24" height="24" rx="8" fill="#b5a6ff" opacity=".45"/><text x="64" y="172" fill="#174f4b" font-size="12" font-weight="700">1</text><text x="57" y="205" font-size="17" fill="#1c464e" font-weight="700">Session selection</text><text x="57" y="235" font-size="12" fill="#58777d" font-weight="400">Confirm provider/account</text><path d="M549 195h18" stroke="#567f7e" stroke-width="2" marker-end="url(#arrow)"/><rect x="307" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="323" y="155" width="24" height="24" rx="8" fill="#b5a6ff" opacity=".45"/><text x="331" y="172" fill="#174f4b" font-size="12" font-weight="700">2</text><text x="324" y="205" font-size="17" fill="#1c464e" font-weight="700">Official device flow</text><text x="324" y="235" font-size="12" fill="#58777d" font-weight="400">Notice, code and cancel</text><path d="M816 195h18" stroke="#567f7e" stroke-width="2" marker-end="url(#arrow)"/><rect x="574" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="590" y="155" width="24" height="24" rx="8" fill="#b5a6ff" opacity=".45"/><text x="598" y="172" fill="#174f4b" font-size="12" font-weight="700">3</text><text x="591" y="205" font-size="17" fill="#1c464e" font-weight="700">Host credentials</text><text x="591" y="235" font-size="12" fill="#58777d" font-weight="400">Official commit and lock</text><rect x="841" y="140" width="239" height="117" rx="16" fill="#fff" stroke="#bad7cd"/><rect x="857" y="155" width="24" height="24" rx="8" fill="#b5a6ff" opacity=".45"/><text x="865" y="172" fill="#174f4b" font-size="12" font-weight="700">4</text><text x="858" y="205" font-size="17" fill="#1c464e" font-weight="700">Login-strip feedback</text><text x="858" y="235" font-size="12" fill="#58777d" font-weight="400">Account and route results</text><text x="41" y="308" font-size="14" fill="#3a6369" font-weight="400">Tokens stay outside the renderer/conversation. Switching waits for the previous flow to settle.</text></g></svg>
